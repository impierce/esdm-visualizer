apiVersion: schema.esdm.io/core/v1
kind: command
name: restock
description: Increases the available stock for an item.
scope:
  domain: shop
  boundedContext: catalog
  aggregate: stock
data:
  type: object
  properties:
    sku: { type: string }
    quantity: { type: integer }
  required: [sku, quantity]
publishes:
  - restocked
actors:
  - staff
