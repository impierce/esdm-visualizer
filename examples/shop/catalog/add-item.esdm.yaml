apiVersion: schema.esdm.io/core/v1
kind: command
name: add-item
description: Adds a newly sellable item to the catalog.
scope:
  domain: shop
  boundedContext: catalog
  aggregate: item
data:
  type: object
  properties:
    sku: { type: string }
    name: { type: string }
    price: { type: number }
  required: [sku, name, price]
publishes:
  - added
actors:
  - staff
---
apiVersion: schema.esdm.io/core/v1
kind: event
name: added
description: Records that an item became available in the catalog.
scope:
  domain: shop
  boundedContext: catalog
  aggregate: item
data:
  type: object
  properties:
    sku: { type: string }
    name: { type: string }
    price: { type: number }
  required: [sku, name, price]
---
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: adding-item
description: Behavior of the item aggregate's add-item command.
scope:
  domain: shop
  boundedContext: catalog
  aggregate: item
scenarios:
  - name: adds-new-item
    description: A new catalog item records its identifying product details.
    given: []
    when:
      command: add-item
      actor: staff
      data: { sku: book-light, name: Light, price: 19.99 }
    then:
      events:
        - event: added
          data: { sku: book-light, name: Light, price: 19.99 }
