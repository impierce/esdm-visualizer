apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: decreasing-stock
description: Behavior of the stock aggregate's decrease-stock command.
scope:
  domain: shop
  boundedContext: catalog
  aggregate: stock
scenarios:
  - name: decreases-when-sufficient
    description: Available stock decreases when the requested quantity is present.
    given:
      - event: restocked
        data: { sku: book-light, quantity: 10 }
    when:
      command: decrease-stock
      data: { sku: book-light, quantity: 4 }
    then:
      events:
        - event: decreased
          data: { sku: book-light, quantity: 4 }
  - name: rejects-when-insufficient
    description: Stock cannot decrease below zero.
    given:
      - event: restocked
        data: { sku: book-light, quantity: 2 }
    when:
      command: decrease-stock
      data: { sku: book-light, quantity: 4 }
    then:
      rejection:
        invariant: quantity-never-negative
